# Render Infrastructure-as-Code (IaC) Blueprint Specification
# WHY: Declaratively defines cloud hosting infrastructure, runtime environment, build commands, health check endpoints, and required environment variables for automatic deployment on Render.

services:
  # Web Service 1: DocMind RAG FastAPI Backend Service
  # WHY: Hosts the backend API engine on Render's free tier web service environment.
  - type: web
    name: docmind-backend
    env: python
    region: singapore
    plan: free
    # WHY: Python version is pinned to 3.11.4 via .python-version file in repo root.
    # This is the correct Render-supported mechanism — pythonVersion in render.yaml is not supported.

    # Build & Startup Commands
    # WHY --extra-index-url: Pre-installs CPU-only PyTorch to stay well within Render free-tier RAM limits during build.
    buildCommand: "pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"

    # Automated Health Monitoring Endpoint
    # WHY /health: Render pings this endpoint periodically to verify service availability before routing traffic.
    healthCheckPath: /health

    # Environment Variables Configuration
    envVars:
      - key: QDRANT_MODE
        value: cloud
      - key: LLM_MODE
        value: groq
      - key: ENVIRONMENT
        value: production
      # WHY EMBED_MODE=api: Disables local PyTorch model loading on Render's 512MB free tier.
      # Embeddings are computed via HuggingFace Inference API, saving ~300MB RAM.
      - key: EMBED_MODE
        value: api

      # Secret keys requiring manual user input in Render dashboard (sync: false)
      - key: GROQ_API_KEY
        sync: false
      - key: QDRANT_CLOUD_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      # WHY HF_TOKEN: Required for HuggingFace Inference API access (EMBED_MODE=api).
      # Get a free token at https://huggingface.co/settings/tokens
      - key: HF_TOKEN
        sync: false
